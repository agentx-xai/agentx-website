name: Bug report
description: Report a reproducible problem in AgentX Website
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please search existing issues first. Do not include credentials, tokens, or private data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
